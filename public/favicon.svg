<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Base Rounded Card -->
  <rect width="32" height="32" rx="7" fill="url(#bg)" />

  <!-- Sheet Document Body -->
  <rect x="6.5" y="5.5" width="19" height="21" rx="2.5" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Clipboard Top Header Clip -->
  <rect x="11.5" y="3.5" width="9" height="3.5" rx="1.5" fill="#1E40AF" />
  <circle cx="16" cy="5.2" r="0.8" fill="#FFFFFF" />

  <!-- Report Data Grid Lines -->
  <!-- Header Line -->
  <rect x="9.5" y="9.5" width="13" height="2" rx="1" fill="#3B82F6" />
  
  <!-- Task 1 -->
  <circle cx="10.8" cy="14" r="1" fill="#10B981" />
  <rect x="13.2" y="13.2" width="9.3" height="1.6" rx="0.8" fill="#64748B" />

  <!-- Task 2 -->
  <circle cx="10.8" cy="17.5" r="1" fill="#10B981" />
  <rect x="13.2" y="16.7" width="7.8" height="1.6" rx="0.8" fill="#94A3B8" />

  <!-- Task 3 -->
  <circle cx="10.8" cy="21" r="1" fill="#3B82F6" />
  <rect x="13.2" y="20.2" width="8.5" height="1.6" rx="0.8" fill="#CBD5E1" />

  <!-- Green Completion Badge in Corner -->
  <circle cx="23.5" cy="23.5" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.2" />
  <path d="M21.8 23.5l1.2 1.2 2.4-2.4" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
